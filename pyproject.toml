[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "utteran"
version = "0.0.1"
description = "Local speaker-aware transcription CLI for audio and video files"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "utteran contributors" }]
dependencies = [
  "faster-whisper>=1.1,<2",
  "huggingface-hub>=0.27,<2",
  "keyring>=25,<26",
  "platformdirs>=4,<5",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-dotenv>=1,<2",
  "rich>=13.9,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
# torch build-selecting extras: exactly one of these three may be installed at
# once (see [tool.uv] conflicts below). Each pulls pyannote.audio plus the
# matching torch/torchaudio wheel from an explicit per-build index.
cpu = [
  "pyannote.audio>=4,<5",
  "torch>=2.8,<2.12",
  "torchaudio>=2.8,<2.12",
]
cuda = [
  "pyannote.audio>=4,<5",
  "torch>=2.8,<2.12",
  "torchaudio>=2.8,<2.12",
]
xpu = [
  "pyannote.audio>=4,<5",
  "torch>=2.8,<2.12",
  "torchaudio>=2.8,<2.12",
  # torch's xpu wheel depends transitively on triton-xpu, but uv only
  # resolves indexed sources (see [tool.uv.sources] below) for packages
  # listed directly in a conflicting extra's own optional-dependencies -
  # a transitive-only requirement is rejected with "Source entry ... was
  # not found under the project.optional-dependencies section for that
  # extra". Windows-only: no non-Windows torch+xpu combination has been
  # verified (see AISTATE.md I-4/I-5).
  "triton-xpu; sys_platform == 'win32'",
]
# Feature-adding extras: composable with any of the above, and with each
# other. Not part of the torch conflict set.
whisper-cpp = ["cmake>=3.28,<5"]
openvino = ["openvino>=2025,<2027", "openai-whisper>=20250625", "onnxscript>=0.2,<1"]
onnx = ["onnxruntime>=1.19,<2"]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }, { extra = "xpu" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cuda" },
  { index = "pytorch-xpu", extra = "xpu" },
]
torchaudio = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cuda" },
  { index = "pytorch-xpu", extra = "xpu" },
]
triton-xpu = [{ index = "pytorch-xpu", extra = "xpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[project.scripts]
utteran = "utteran.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/utteran"]

[tool.pytest.ini_options]
addopts = "-ra --capture=sys"
testpaths = ["tests"]
markers = [
  "requires_model: tests that require downloaded inference models",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["utteran"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
  "ctranslate2",
  "faster_whisper",
  "huggingface_hub",
  "huggingface_hub.*",
  "keyring",
  "onnxruntime",
  "openvino",
  "pyannote.*",
  "torch",
]
ignore_missing_imports = true
follow_imports = "skip"
