[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "utteran"
version = "0.1.0"
description = "Local speaker-aware transcription CLI for audio and video files"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "utteran contributors" }]
dependencies = [
  "faster-whisper>=1.1,<2",
  "huggingface-hub>=0.27,<2",
  "keyring>=25,<26",
  "platformdirs>=4,<5",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-dotenv>=1,<2",
  "rich>=13.9,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
pyannote = [
  "pyannote.audio>=4,<5",
]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
]

[project.scripts]
utteran = "utteran.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/utteran"]

[tool.pytest.ini_options]
addopts = "-ra --capture=sys"
testpaths = ["tests"]
markers = [
  "requires_model: tests that require downloaded inference models",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["utteran"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
  "ctranslate2",
  "faster_whisper",
  "huggingface_hub",
  "huggingface_hub.*",
  "keyring",
  "pyannote.*",
  "torch",
]
ignore_missing_imports = true
follow_imports = "skip"
