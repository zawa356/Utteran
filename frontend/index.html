<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Replaced per response by the server (utteran_gui.next_ui); never a fixed value. -->
    <meta name="csp-nonce" content="__UTTERAN_CSP_NONCE__" />
    <!-- Replaced by the server with the API mode *it* enabled ("legacy" or "v1-dev", S5-A). Not a secret. -->
    <meta name="utteran-api-mode" content="__UTTERAN_API_MODE__" />
    <title>Utteran</title>
  </head>
  <body>
    <!-- Native file drop target (utteran_gui.app binds "#input-drop-zone" once per document load).
         Static, so it exists before Vue mounts and is never replaced by a re-render. -->
    <div id="input-drop-zone"><div id="app"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
