# E-C2a (Issue #86) PoC workspace. Not part of the product build:
# nothing in pyproject.toml, uv.lock or the product CI depends on it.
[workspace]
resolver = "3"
members = ["safe-fs", "safe-fs-py"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
