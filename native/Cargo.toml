# Native workspace (E-C2a #86 / E-C2b #87). Built separately from the product:
# the GUI bundles the utteran-native-fs wheel; pyproject.toml and uv.lock do not list it.
[workspace]
resolver = "3"
members = ["safe-fs", "safe-fs-py"]

[workspace.package]
version = "0.1.70"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"
