name: Contracts and backend integration
description: Run the locked contract and backend compatibility checks.
inputs:
  python-version:
    description: Python version to test.
    required: true
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: true
    - shell: bash
      run: uv sync --extra dev --extra gui --locked
    - name: Contract, schema, import boundary, and B7-B9 integration tests (no models)
      shell: bash
      run: uv run --no-sync pytest tests/test_contracts.py tests/test_contracts_schema.py tests/test_contracts_boundary.py tests/test_worker_protocol.py tests/test_capability_inventory.py tests/test_capability_bridge.py tests/test_b4_smoke_evidence.py tests/test_b4_smoke_executor.py tests/test_b4_smoke_b7.py tests/test_b5_settings.py tests/test_b6_control.py tests/test_b7_jobs.py tests/test_b7_api.py tests/test_b7_review_fixes.py tests/test_b8_setup.py tests/test_b8_api.py tests/test_b8_review_fixes.py tests/test_b9_events.py tests/test_b9_review_fixes.py tests/test_backend_foundation_e2e.py
    - shell: bash
      run: uv run --no-sync python -m utteran_contracts.schema --output docs/architecture/b1/contracts.schema.json --check
    - shell: bash
      run: uv run --no-sync python -m utteran_contracts.capability_schema --output docs/architecture/b4/capabilities.schema.json --check
    - shell: bash
      run: uv run --no-sync python -m utteran_contracts.preview_schema --output docs/architecture/b5/preview.schema.json --check
    - shell: bash
      run: uv run --no-sync python -m utteran_contracts.control_schema --output docs/architecture/b6/control.schema.json --check
    - shell: bash
      run: uv run --no-sync python -m utteran_contracts.job_schema --output docs/architecture/b7/jobs.schema.json --check
    - shell: bash
      run: uv run --no-sync python -m utteran_contracts.setup_schema --output docs/architecture/b8/setup.schema.json --check
    - shell: bash
      run: uv run --no-sync python -m utteran_contracts.events_schema --output docs/architecture/b9/events.schema.json --check
