name: Set up locked frontend dependencies
description: Install the pinned Node and npm, then install the frontend lockfile.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version-file: frontend/.nvmrc
        package-manager-cache: false
    - name: Pin npm (package.json packageManager)
      working-directory: frontend
      shell: bash
      run: |
        npm install --global npm@11.21.1
        npm --version
    - name: Locate npm download cache
      id: npm-cache
      working-directory: frontend
      shell: bash
      run: echo "path=$(npm config get cache)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ steps.npm-cache.outputs.path }}/_cacache
        key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/.nvmrc', 'frontend/package.json', 'frontend/package-lock.json', '.github/actions/setup-frontend/action.yml') }}
    - name: Install exactly the committed lockfile
      working-directory: frontend
      shell: bash
      run: npm ci --no-fund
