name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install development dependencies
        run: uv sync --extra dev --extra gui --locked
      - name: Check lockfile
        run: uv lock --check
      - name: Check offline contract schema
        run: uv run --no-sync python -m utteran_contracts.schema --output docs/architecture/b1/contracts.schema.json --check
      - name: Check offline worker schema
        run: uv run --no-sync python -m utteran_contracts.worker_schema --output docs/architecture/b3/worker.schema.json --check
      - name: Check offline capability schema
        run: uv run --no-sync python -m utteran_contracts.capability_schema --output docs/architecture/b4/capabilities.schema.json --check
      - name: Lint
        run: uv run --no-sync ruff check src tests tools
      - name: Check formatting
        run: uv run --no-sync ruff format --check src tests tools
      - name: Type check
        run: uv run --no-sync mypy
      - name: Test without models
        run: uv run --no-sync pytest -m "not requires_model"
      - name: Check PowerShell UTF-8 BOM
        run: uv run --no-sync python tools/check_powershell_bom.py
      - name: Reject new private data in tracked files
        run: >-
          uv run --no-sync python tools/public_history_scan.py
          --worktree --fail-on-findings
      - name: Audit complete reachable history
        run: >-
          uv run --no-sync python tools/public_history_scan.py
          --json output/public-history-scan-ci.json

  windows-tests:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install development dependencies
        run: uv sync --extra dev --extra gui --locked
      - name: Test without models
        run: uv run --no-sync pytest -m "not requires_model"
      - name: Parse every PowerShell script with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          foreach ($file in (git ls-files '*.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $file), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Start headless-safe PowerShell scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach ($file in (git ls-files '*.ps1')) {
            if ($file -eq 'build.ps1' -or $file -eq 'gui.ps1') {
              # build.ps1 requires Inno Setup and gui.ps1 opens a native window;
              # both are syntax-checked above but have no safe headless startup mode.
              continue
            } elseif ($file -eq 'setup.ps1') {
              $output = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $file -List 2>&1
            } elseif ($file -eq 'start.ps1') {
              $output = '0' | & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $file 2>&1
            } elseif ($file -eq 'run.ps1') {
              $output = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $file `
                -Profile cpu --help 2>&1
            } else {
              $output = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $file 2>&1
            }
            if ($output -match 'ParserError|Unexpected token|FullyQualifiedErrorId.*ParserError') {
              Write-Error "$file failed Windows PowerShell startup parsing"
              exit 1
            }
          }

  contracts-python-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --extra dev --extra gui --locked
      - name: Contract, schema, and import boundary tests (no models)
        run: uv run --no-sync pytest tests/test_contracts.py tests/test_contracts_schema.py tests/test_contracts_boundary.py tests/test_worker_protocol.py tests/test_capability_inventory.py tests/test_capability_bridge.py
      - run: uv run --no-sync python -m utteran_contracts.schema --output docs/architecture/b1/contracts.schema.json --check
      - run: uv run --no-sync python -m utteran_contracts.capability_schema --output docs/architecture/b4/capabilities.schema.json --check
