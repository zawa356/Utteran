name: CI

# Every quality gate is its own job with no `needs:` edges, so one red gate never
# hides another (Issue #27: a mypy failure used to stop Linux pytest, the BOM check,
# and both privacy scans from running at all). A failing job stays red: no
# `continue-on-error`, `|| true`, or `if: always()` is used to mask a result.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-lock-schema:
    name: Linux lock and offline schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install development dependencies
        run: uv sync --extra dev --extra gui --locked
      - name: Check lockfile
        run: uv lock --check
      - name: Check offline contract schema
        run: uv run --no-sync python -m utteran_contracts.schema --output docs/architecture/b1/contracts.schema.json --check
      - name: Check offline worker schema
        run: uv run --no-sync python -m utteran_contracts.worker_schema --output docs/architecture/b3/worker.schema.json --check
      - name: Check offline capability schema
        run: uv run --no-sync python -m utteran_contracts.capability_schema --output docs/architecture/b4/capabilities.schema.json --check
      - name: Check offline B5 preview schema
        run: uv run --no-sync python -m utteran_contracts.preview_schema --output docs/architecture/b5/preview.schema.json --check
      - name: Check offline B6 control schema
        run: uv run --no-sync python -m utteran_contracts.control_schema --output docs/architecture/b6/control.schema.json --check
      - name: Check offline B7 job schema
        run: uv run --no-sync python -m utteran_contracts.job_schema --output docs/architecture/b7/jobs.schema.json --check
      - name: Check offline B8 setup schema
        run: uv run --no-sync python -m utteran_contracts.setup_schema --output docs/architecture/b8/setup.schema.json --check
      - name: Check offline B9 events schema
        run: uv run --no-sync python -m utteran_contracts.events_schema --output docs/architecture/b9/events.schema.json --check

  linux-lint:
    name: Linux Ruff lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install development dependencies
        run: uv sync --extra dev --extra gui --locked
      - name: Lint
        run: uv run --no-sync ruff check src tests tools
      - name: Check formatting
        run: uv run --no-sync ruff format --check src tests tools

  linux-types:
    name: Linux mypy (linux and win32 platforms)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install development dependencies
        run: uv sync --extra dev --extra gui --locked
      - name: Type check (linux platform)
        run: uv run --no-sync mypy
      # Windows-only branches (Job Objects, Win32 ctypes) are skipped by the
      # linux-platform check above; this checks them against the win32 stubs.
      - name: Type check (win32 platform)
        run: uv run --no-sync mypy --platform win32

  linux-tests:
    name: Linux pytest (no models)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install development dependencies
        run: uv sync --extra dev --extra gui --locked
      - name: Test without models
        run: uv run --no-sync pytest -m "not requires_model" -rfEs

  windows-tests:
    name: Windows pytest (no models)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install development dependencies
        run: uv sync --extra dev --extra gui --locked
      - name: Test without models
        run: uv run --no-sync pytest -m "not requires_model" -rfEs
      # Issue #27 PID-file race regression: one green run is not evidence of a
      # fixed race, so the Job Object parent-death test is repeated every run.
      - name: Repeat Job Object parent-death test (PID-file race guard)
        shell: pwsh
        run: |
          $node = 'tests/test_gui_processes.py::test_supervisor_job_closes_after_forced_parent_exit'
          for ($i = 1; $i -le 20; $i++) {
            uv run --no-sync pytest -q -p no:cacheprovider $node
            if ($LASTEXITCODE -ne 0) { Write-Error "iteration $i failed"; exit 1 }
          }
          Write-Host "20/20 iterations passed"

  windows-powershell:
    name: Windows PowerShell 5.1 parse and headless startup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Parse every PowerShell script with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          $files = @(git ls-files '*.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $file), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          Write-Host "Parsed $($files.Count) tracked PowerShell script(s) without errors"
      # Only scripts with a source-verified side-effect-free mode are started.
      # The table is exhaustive: a newly tracked .ps1 must be classified here
      # (started with a safe mode, or parse-only with a reason) or this step fails.
      # See docs/architecture/backend/testing-and-operations.md.
      - name: Start headless-safe PowerShell scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          # Actions prepends $ErrorActionPreference='stop'; with PS 5.1 that turns a
          # child's stderr into a terminating error before its exit code can be
          # checked. Results are tracked explicitly in $failed instead.
          $ErrorActionPreference = 'Continue'
          $parseOnly = @{
            'build.ps1' = 'requires Inno Setup and produces release artifacts'
            'gui.ps1' = 'opens a native GUI window'
            'scripts/verify_uninstaller.ps1' = 'installs/uninstalls a lab build with Inno Setup 6 (Windows acceptance only)'
            'tools/generate_benchmark_fixture.ps1' = 'rewrites a tracked test fixture with a system TTS voice'
          }
          $startup = @(
            @{ File = 'setup.ps1'; Args = @('-List'); Stdin = $null; Exit = @(0); Expect = 'cpu' },
            @{ File = 'run.ps1'; Args = @('-Profile', 'cpu', '--help'); Stdin = $null; Exit = @(1); Expect = 'win-cpu' },
            @{ File = 'start.ps1'; Args = @(); Stdin = '0'; Exit = @(0); Expect = $null },
            @{ File = 'launch-python.ps1'; Args = @('-CheckOnly'); Stdin = $null; Exit = @(0, 1); Expect = 'utteran' },
            @{ File = 'scripts/reset-env.ps1'; Args = @('-WhatIf'); Stdin = $null; Exit = @(0); Expect = 'openvino-genai-compiled' }
          )
          $failed = $false
          $classified = @($parseOnly.Keys) + @($startup | ForEach-Object { $_.File })
          foreach ($file in (git ls-files '*.ps1')) {
            if ($classified -notcontains $file) {
              Write-Error "$file is not classified as headless-safe or parse-only"
              $failed = $true
            }
          }
          foreach ($entry in $startup) {
            $scriptArgs = @($entry.Args)
            if ($null -ne $entry.Stdin) {
              $output = $entry.Stdin | & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $entry.File @scriptArgs 2>&1
            } else {
              $output = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $entry.File @scriptArgs 2>&1
            }
            $code = $LASTEXITCODE
            $text = ($output | Out-String)
            Write-Host "--- $($entry.File) $($scriptArgs -join ' ') -> exit $code"
            if ($text -match 'ParserError|Unexpected token|FullyQualifiedErrorId.*ParserError') {
              Write-Error "$($entry.File) failed Windows PowerShell startup parsing"
              $failed = $true
            }
            if ($entry.Exit -notcontains $code) {
              Write-Host $text
              Write-Error "$($entry.File) exited $code; expected one of $($entry.Exit -join ', ')"
              $failed = $true
            }
            if ($null -ne $entry.Expect -and $text -notmatch [regex]::Escape($entry.Expect)) {
              Write-Host $text
              Write-Error "$($entry.File) output did not contain '$($entry.Expect)'"
              $failed = $true
            }
          }
          foreach ($file in $parseOnly.Keys) {
            Write-Host "parse-only: $file ($($parseOnly[$file]))"
          }
          if ($failed) { exit 1 }
          exit 0

  contracts-python-compatibility:
    name: Contracts and backend integration (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --extra dev --extra gui --locked
      - name: Contract, schema, import boundary, and B7-B9 integration tests (no models)
        run: uv run --no-sync pytest tests/test_contracts.py tests/test_contracts_schema.py tests/test_contracts_boundary.py tests/test_worker_protocol.py tests/test_capability_inventory.py tests/test_capability_bridge.py tests/test_b5_settings.py tests/test_b6_control.py tests/test_b7_jobs.py tests/test_b7_api.py tests/test_b7_review_fixes.py tests/test_b8_setup.py tests/test_b8_api.py tests/test_b8_review_fixes.py tests/test_b9_events.py tests/test_b9_review_fixes.py tests/test_backend_foundation_e2e.py
      - run: uv run --no-sync python -m utteran_contracts.schema --output docs/architecture/b1/contracts.schema.json --check
      - run: uv run --no-sync python -m utteran_contracts.capability_schema --output docs/architecture/b4/capabilities.schema.json --check
      - run: uv run --no-sync python -m utteran_contracts.preview_schema --output docs/architecture/b5/preview.schema.json --check
      - run: uv run --no-sync python -m utteran_contracts.control_schema --output docs/architecture/b6/control.schema.json --check
      - run: uv run --no-sync python -m utteran_contracts.job_schema --output docs/architecture/b7/jobs.schema.json --check
      - run: uv run --no-sync python -m utteran_contracts.setup_schema --output docs/architecture/b8/setup.schema.json --check
      - run: uv run --no-sync python -m utteran_contracts.events_schema --output docs/architecture/b9/events.schema.json --check

  powershell-bom:
    name: PowerShell UTF-8 BOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - name: Check PowerShell UTF-8 BOM (stdlib only)
        run: uv run --no-project python tools/check_powershell_bom.py

  privacy-worktree:
    name: Privacy scan of tracked files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      # Prints counts only; matched values are never printed or written.
      - name: Reject new private data in tracked files
        run: >-
          uv run --no-project python tools/public_history_scan.py
          --worktree --fail-on-findings

  privacy-history:
    name: Privacy audit of reachable history (report only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      # History is never rewritten by CI; the redacted report records counts and
      # locations only (see docs/architecture/backend/validation.md).
      - name: Audit complete reachable history
        run: >-
          uv run --no-project python tools/public_history_scan.py
          --json output/public-history-scan-ci.json
