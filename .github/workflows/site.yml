name: Website (Astro / Starlight)

on:
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install website dependencies
        working-directory: site
        run: npm install --no-audit --no-fund
      - name: Capture resolved dependency lock (temporary)
        working-directory: site
        if: github.event_name == 'pull_request'
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const compact = JSON.stringify(JSON.parse(fs.readFileSync('package-lock.json', 'utf8')));
          for (let offset = 0; offset < compact.length; offset += 1800) {
            console.log('UTTERAN_LOCK_CHUNK:' + compact.slice(offset, offset + 1800));
          }
          NODE
      - name: Build and validate Japanese / English routes
        working-directory: site
        run: npm run build
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
