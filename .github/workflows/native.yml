name: Native

# Rust safe-fs core and its internal wheel (E-C2a #86 adopted, E-C2b #87). Runs on every PR
# and main push, independent of ci.yml (whose gate keeps its 18 job IDs). "Native quality
# gate" accepts exactly the job IDs below, each with result success. Runner results are
# CI evidence, not Windows 11 VM acceptance.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  native-linux:
    name: Native (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/native-build-test

  native-windows:
    name: Native (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/native-build-test

  native-macos:
    name: Native (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/native-build-test

  native-audit:
    name: Native dependency audit (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: native
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install the pinned Rust toolchain and cargo-deny
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          cargo install cargo-deny --locked --version 0.22.1
      - name: Advisories, licenses, bans, sources
        run: cargo deny --locked check

  native-gate:
    name: Native quality gate
    if: ${{ always() }}
    needs: [native-linux, native-windows, native-macos, native-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Require success from exactly the expected native jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e '
            type == "object"
            and keys == (["native-audit","native-linux","native-macos","native-windows"])
            and all(.[]; .result == "success")
          ' <<< "$RESULTS"
