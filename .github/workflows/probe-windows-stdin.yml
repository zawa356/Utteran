name: probe-windows-stdin-numpy
on:
  push:
    branches: [claude/magical-gauss-u1i47m]
permissions:
  contents: read
jobs:
  red-worker-stdin:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra gui --locked
      # Diagnostic only: now with the fix (a5e39dd) applied.
      - run: uv run --no-sync pytest tests/test_worker_stdin_isolation.py tests/test_ambient_env_isolation.py -rfEs -p no:cacheprovider --durations=0
  windows-e2e:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: frontend/.nvmrc
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - run: npm install -g npm@11.21.1
      - working-directory: frontend
        run: npm ci --no-fund
      - working-directory: frontend
        run: npm run build
      - run: uv sync --extra dev --extra gui --locked
      - working-directory: frontend
        run: npx playwright install chromium
      - working-directory: frontend
        run: npx playwright test --trace off
