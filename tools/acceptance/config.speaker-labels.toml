[general]
output_dir = "./output/_acceptance/artifacts"
job_dir = "./output/_acceptance/jobs"
log_level = "info"

[asr]
backend = "faster-whisper"
model = "large-v3-turbo"
device = "cpu"
compute_type = "int8"
language = "ja"
vad_filter = true
condition_on_previous_text = false
beam_size = 5
initial_prompt = ""

[diarization]
enabled = true
backend = "pyannote"
model = "pyannote/speaker-diarization-community-1"
device = "cpu"
num_speakers = 0
min_speakers = 0
max_speakers = 0

[output]
formats = ["json"]
srt_bom = false
newline = "lf"
show_speaker = true
speaker_labels = { SPEAKER_00 = "話者A" }

[ffmpeg]
path = "C:/path/ffmpeg/bin/ffmpeg.exe"

[alignment]
max_nearest_distance = 2.0
min_segment_duration = 0.3
min_segment_words = 2
merge_gap = 0.5
renumber_speakers = true
