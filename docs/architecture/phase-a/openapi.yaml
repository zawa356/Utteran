            minLength: 1
            maxLength: 256
          maxItems: 1000
        beam_size:
          type: integer
          minimum: 1
          maximum: 100
        vad:
          $ref: '#/components/schemas/VadSettings'
        word_timestamps:
          type: string
          enum:
          - auto
          - always
          - never
        condition_on_previous_text: *id003
        faster_whisper:
          $ref: '#/components/schemas/FasterWhisperSettings'
        whisper_cpp:
          $ref: '#/components/schemas/WhisperCppSettings'
        openvino_genai:
          $ref: '#/components/schemas/GenAISettings'
        extra_arguments:
          $ref: '#/components/schemas/ExtraArguments'
