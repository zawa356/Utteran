          - int8_float16
          - float16
          - float32
      required: []
    WhisperCppSettings:
      type: object
      additionalProperties: false
      properties:
        temperature:
          type: number
          minimum: 0
          maximum: 1
        temperature_increment:
          type: number
          minimum: 0
          maximum: 1
        no_context: *id003
        dtw:
          type: string
        threads:
          type: integer
          minimum: 0
        entropy_threshold:
          type: number
        logprob_threshold:
          type: number
        no_speech_threshold:
          type: number
          minimum: 0
          maximum: 1
        vad: *id003
        vad_model:
          anyOf:
          - &id014
            type: string
            minLength: 1
            maxLength: 32768
          - type: 'null'
        vad_threshold:
          type: number
          minimum: 0
          maximum: 1
        repetition_limit:
          type: integer
          minimum: 0
        max_word_duration_seconds:
          type: number
