      additionalProperties: false
      properties:
        schema_version: *id004
        id: *id001
        revision: *id002
        profile_kind:
          type: string
          enum:
          - cpu
          - cuda
          - intel
          - vulkan
        generation: *id001
        state:
          type: string
          enum:
          - not_installed
          - building
          - verifying
          - ready
          - degraded
          - incompatible
          - failed
          - interrupted
        lock_fingerprint:
          anyOf:
          - *id001
          - type: 'null'
        extras:
          type: array
          items:
            type: string
        hardware:
          $ref: '#/components/schemas/Observation'
        runtime:
          $ref: '#/components/schemas/Observation'
        smoke:
          $ref: '#/components/schemas/Observation'
        blockers:
          type: array
          items: *id001
        preserved_generation_ids:
          type: array
          items: *id001
      required:
      - schema_version
      - id
      - revision
      - profile_kind
      - generation
      - state
      - lock_fingerprint
      - extras
      - hardware
      - runtime
      - smoke
      - blockers
      - preserved_generation_ids
    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        schema_version: *id004
        profile_ids:
          type: array
          items: *id001
      required:
      - schema_version
      - profile_ids
    RefreshOperation:
      type: object
      additionalProperties: false
      properties:
        schema_version: *id004
        id: *id001
        revision: *id002
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - interrupted
        inventory_revision:
          anyOf:
          - *id002
          - type: 'null'
        error:
          anyOf:
          - $ref: '#/components/schemas/ErrorDetail'
          - type: 'null'
      required:
      - schema_version
      - id
      - revision
      - status
      - inventory_revision
      - error
    VadSettings:
      type: object
      additionalProperties: false
      properties:
        enabled: *id003
        threshold:
          type: number
          minimum: 0
          maximum: 1
      required:
