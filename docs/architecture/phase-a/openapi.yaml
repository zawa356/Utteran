      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryRequest'
      description: Only blocked jobs; rechecks identical frozen snapshot. Does not resolve a new candidate
        or update snapshot.
components:
  securitySchemes:
    LocalSessionCookie:
      type: apiKey
      in: cookie
      name: utteran_gui_session
    LocalSessionHeader:
      type: apiKey
      in: header
      name: x-utteran-session
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
      description: Persisted key; replay before If-Match checks. See contracts.md.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[0-9]+"$
      description: Exact resource ETag, wildcard forbidden.
    Cursor:
      name: cursor
      in: query
      required: false
      schema: *id001
  responses:
    Error400:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error401:
      description: Session required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error403:
      description: Origin or Host rejected
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error404:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error409:
      description: State/idempotency/resolution conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error410:
      description: Event cursor expired; use sync
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error412:
      description: Revision mismatch
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error413:
      description: Payload too large
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error422:
      description: Schema or semantic validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error428:
      description: If-Match required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error503:
      description: Storage/runtime unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Issue:
      type: object
      additionalProperties: false
      properties:
        path:
          type: string
        code: *id001
        message_key: *id001
      required:
      - path
      - code
      - message_key
    ErrorDetail:
      type: object
      additionalProperties: false
      properties:
        code: *id001
        message_key: *id001
        request_id: *id001
        retryable: &id003
          type: boolean
        issues:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
        resource_id: *id001
      required:
      - code
      - message_key
      - request_id
      - retryable
      - issues
    Error:
      type: object
      additionalProperties: false
      properties:
        schema_version: &id004
          type: integer
          const: 1
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - schema_version
      - error
    Ref:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        revision: *id002
      required:
      - id
      - revision
    Observation:
      type: object
      additionalProperties: false
      properties:
        state:
          type: string
          enum:
          - passed
          - failed
          - unknown
          - not_applicable
        observed_at:
          anyOf:
          - &id015
            type: string
            format: date-time
          - type: 'null'
        fingerprint:
          anyOf:
          - *id001
          - type: 'null'
        reason_code: *id001
      required:
      - state
      - observed_at
      - fingerprint
      - reason_code
    Route:
      type: object
      additionalProperties: false
      properties:
        native_variant:
          anyOf:
          - type: string
            enum:
            - cpu
            - vulkan
            - openvino
            - openvino_vulkan
          - type: 'null'
        encoder:
          type: string
        decoder:
          type: string
      required:
      - native_variant
      - encoder
      - decoder
    RouteObservation:
      type: object
      additionalProperties: false
      properties:
        requested:
          $ref: '#/components/schemas/Route'
        initialized:
          anyOf:
          - $ref: '#/components/schemas/Route'
          - type: 'null'
        encoder_observed:
          type: string
          description: unknown when not verified
        decoder_observed:
          type: string
          description: unknown when not verified
        fallback_occurred: *id003
        fallback_reason:
          anyOf:
          - *id001
          - type: 'null'
      required:
      - requested
      - initialized
      - encoder_observed
      - decoder_observed
      - fallback_occurred
      - fallback_reason
    ParameterCapability:
      type: object
      additionalProperties: false
      properties:
        path:
          type: string
          pattern: ^/
        type:
          type: string
          enum:
          - string
          - number
          - integer
          - boolean
          - array
          - 'null'
        status:
          type: string
          enum:
          - supported
          - unsupported
          - unverified
        reason_code: *id001
        enum_values:
          type: array
          items:
            type: string
        minimum:
          type: number
        maximum:
          type: number
        sensitive: *id003
      required:
      - path
      - type
      - status
      - reason_code
      - sensitive
    ArgumentCapability:
      type: object
      additionalProperties: false
      properties:
        name: *id001
        aliases:
          type: array
          items:
            type: string
        arity:
          type: integer
          minimum: 0
          maximum: 1
        status:
          type: string
          enum:
          - known_supported
          - known_invalid
          - reserved
        value_type:
          type: string
          enum:
          - string
          - number
          - integer
          - boolean
        native_version: *id001
        typed_path:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - name
      - aliases
      - arity
      - status
      - value_type
      - native_version
      - typed_path
    Candidate:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        recipe_id: *id001
        profile_ref:
          $ref: '#/components/schemas/Ref'
        backend:
          type: string
          enum:
          - faster-whisper
          - whisper-cpp
          - openvino-genai
        model_ref: *id001
        model_revision: *id001
        requested_route:
          $ref: '#/components/schemas/Route'
        software_support:
          type: string
          enum:
          - supported
          - unsupported
        hardware:
          $ref: '#/components/schemas/Observation'
        runtime:
          $ref: '#/components/schemas/Observation'
        venv:
          $ref: '#/components/schemas/Observation'
        model:
          $ref: '#/components/schemas/Observation'
        native:
          $ref: '#/components/schemas/Observation'
        smoke:
          $ref: '#/components/schemas/Observation'
        runnable:
          type: string
          enum:
          - ready
          - blocked
          - unknown
        blockers:
          type: array
          items: *id001
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/ParameterCapability'
        arguments:
          type: array
          items:
            $ref: '#/components/schemas/ArgumentCapability'
        interruptibility:
          type: string
          enum:
          - cooperative
          - delayed
          - process_boundary_only
          - unknown
        cancel_latency_seconds:
          anyOf:
          - type: number
            minimum: 0
          - type: 'null'
        pause_supported:
          const: false
          type: boolean
      required:
      - id
      - recipe_id
      - profile_ref
      - backend
      - model_ref
      - model_revision
      - requested_route
      - software_support
      - hardware
      - runtime
      - venv
      - model
      - native
      - smoke
      - runnable
      - blockers
      - parameters
      - arguments
      - interruptibility
      - cancel_latency_seconds
      - pause_supported
    Capabilities:
      type: object
      additionalProperties: false
      properties:
        schema_version: *id004
        revision: *id002
        inventory_revision: *id002
