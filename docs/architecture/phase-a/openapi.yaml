      tags:
      - jobs
      summary: revalidateBlockedJob
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
          headers:
            ETag:
              schema:
                type: string
              description: Revision ETag on resource GET/mutation; collection has its own revision
            Location:
              schema:
                type: string
              description: Canonical created/accepted resource or job collection; no secret query parameters
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '412':
          $ref: '#/components/responses/Error412'
        '413':
          $ref: '#/components/responses/Error413'
        '422':
          $ref: '#/components/responses/Error422'
        '428':
          $ref: '#/components/responses/Error428'
        '503':
          $ref: '#/components/responses/Error503'
      parameters:
      - name: job_id
